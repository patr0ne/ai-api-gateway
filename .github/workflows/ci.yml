name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check formatting with Black
        run: black --check .

      - name: Lint with Flake8
        run: flake8 src tests migrations

      - name: Lint with Ruff
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Type-check with Pyright
        run: pyright --pythonpath "$(which python)"

      - name: Run unit and mocked-transport tests
        run: python -m pytest -q -m "not integration"

  integration:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GATEWAY_DATABASE_DSN: postgresql://gateway:ci-test-password@127.0.0.1:5432/gateway_test
      TEST_POSTGRES_DSN: postgresql://gateway:ci-test-password@127.0.0.1:5432/gateway_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gateway_test
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Check Alembic heads
        run: python -m pytest -q tests/test_migrations.py

      - name: Upgrade an empty database
        run: python -m alembic upgrade head

      - name: Run live integration tests
        run: python -m pytest -q -m integration

  container:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ci-compose-password
      GATEWAY_PORT: 8000
      GATEWAY_API_KEY_FINGERPRINT_PEPPER: ci-only-fingerprint-pepper-32-characters
      GATEWAY_UPSTREAM_BASE_URL: https://provider.invalid/v1/
      GATEWAY_UPSTREAM_API_KEY: ci-only-provider-key
      GATEWAY_UPSTREAM_TIMEOUT_SECONDS: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the environment
        run: docker compose up --build --detach --wait

      - name: Check gateway health
        run: curl --fail --silent --show-error http://127.0.0.1:8000/health

      - name: Show diagnostics after failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: Remove test environment
        if: always()
        run: docker compose down --volumes --rmi local --remove-orphans
