[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-api-gateway"
version = "0.1.0"
description = "Production-oriented API gateway with distributed rate limiting"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Artem Yalilov" },
]
dependencies = [
  "alembic>=1.18,<2",
  "asyncpg>=0.31,<1",
  "fastapi>=0.135,<1",
  "pydantic-settings>=2.13,<3",
  "sqlalchemy[asyncio]>=2.0.49,<3",
  "uvicorn[standard]>=0.41,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
  "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_api_gateway"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
